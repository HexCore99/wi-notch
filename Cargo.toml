[package]
name = "wi-notch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
gpui = "=0.2.2"
raw-window-handle = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-future = "0.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
